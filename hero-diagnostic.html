<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页 / 功能页首屏诊断</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#07163f;color:#eef4ff}
    body{display:grid;grid-template-rows:auto minmax(0,1fr)}
    .bar{display:flex;align-items:center;gap:8px;min-height:54px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.14);background:#0b1d55;overflow-x:auto}
    .bar strong{white-space:nowrap;margin-right:4px;font-size:13px}
    .bar button{flex:0 0 auto;padding:7px 10px;border:1px solid rgba(223,233,255,.22);border-radius:999px;background:rgba(255,255,255,.06);color:#eaf1ff;cursor:pointer;font:inherit;font-size:12px}
    .bar button.is-active{background:rgba(89,122,219,.34);border-color:rgba(214,226,255,.7)}
    .legend{margin-left:auto;display:flex;gap:10px;white-space:nowrap;font-size:11px;color:rgba(238,244,255,.72)}
    .legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border:2px solid;vertical-align:-1px}
    .legend .c{border-color:#00d8ff}.legend .h{border-color:#40ff66}.legend .p{border-color:#ff5050}
    .stage{position:relative;min-height:0}
    iframe{width:100%;height:100%;border:0;background:#10235f}
    .info{position:absolute;z-index:5;right:12px;top:12px;width:min(430px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;padding:13px 14px;border:1px solid rgba(217,229,255,.24);border-radius:14px;background:rgba(6,18,58,.9);box-shadow:0 16px 46px rgba(0,0,0,.28);backdrop-filter:blur(12px);font-size:12px;line-height:1.5}
    .info h2{margin:0 0 8px;font-size:14px}.info table{width:100%;border-collapse:collapse}.info th,.info td{padding:4px 6px;border-top:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:top;word-break:break-all}.info th{width:115px;color:#9fb8ff;font-weight:600}.info .note{margin-top:8px;color:#ffd88a}
    @media(max-width:760px){.legend{display:none}.info{top:auto;bottom:8px;right:8px;width:calc(100% - 16px);max-height:38%}}
  </style>
</head>
<body>
  <div class="bar">
    <strong>首屏真实边界诊断</strong>
    <button data-route="home" class="is-active">首页</button>
    <button data-route="airspace">空域信息</button>
    <button data-route="ai">行业日报</button>
    <button data-route="urban">城市更新</button>
    <button data-route="policy">资料库</button>
    <div class="legend"><span><i class="c"></i>container</span><span><i class="h"></i>home hero</span><span><i class="p"></i>feature page-head</span></div>
  </div>
  <div class="stage">
    <iframe id="frame" src="./#home" title="站点首屏诊断"></iframe>
    <aside class="info" id="info"><h2>正在读取实际计算样式…</h2></aside>
  </div>
<script>
const frame=document.getElementById('frame');
const info=document.getElementById('info');
const buttons=[...document.querySelectorAll('[data-route]')];
let route='home';

function inject(){
  const doc=frame.contentDocument;if(!doc)return;
  let s=doc.querySelector('style[data-hero-diagnostic]');
  if(!s){s=doc.createElement('style');s.dataset.heroDiagnostic='1';doc.head.appendChild(s)}
  s.textContent=`
    .welcome-pavilion{display:none!important}
    body{overflow-y:auto!important}
    main.container{outline:2px solid #00d8ff!important;outline-offset:-2px!important}
    #home .hero{outline:3px solid #40ff66!important;outline-offset:-3px!important}
    #airspace .page-head,#ai .page-head,#urban .page-head,#policy .page-head{outline:3px solid #ff5050!important;outline-offset:-3px!important}
  `;
}
function px(n){return Number.isFinite(n)?`${n.toFixed(1)}px`:'-'}
function row(k,v){return `<tr><th>${k}</th><td>${String(v).replace(/</g,'&lt;')}</td></tr>`}
function inspect(){
  const doc=frame.contentDocument;if(!doc)return;
  inject();
  const container=doc.querySelector('main.container');
  const target=route==='home'?doc.querySelector('#home .hero'):doc.querySelector(`#${route} .page-head`);
  const page=doc.querySelector(`#${route}`);
  if(!container||!target||!page)return;
  const cr=container.getBoundingClientRect(),tr=target.getBoundingClientRect();
  const cs=getComputedStyle(target), ps=getComputedStyle(page,'::before');
  const html=`<h2>${route==='home'?'首页 .hero.panel':`#${route} .page-head.panel`} 实际计算结果</h2><table>`+
    row('container 左/宽',`${px(cr.left)} / ${px(cr.width)}`)+
    row('目标 左/宽',`${px(tr.left)} / ${px(tr.width)}`)+
    row('目标 高度',px(tr.height))+
    row('display',cs.display)+
    row('background',cs.background)+
    row('border',`${cs.borderTopWidth} ${cs.borderTopStyle} ${cs.borderTopColor}`)+
    row('border-radius',cs.borderRadius)+
    row('box-shadow',cs.boxShadow)+
    row('backdrop-filter',cs.backdropFilter||cs.webkitBackdropFilter||'none')+
    row('padding',cs.padding)+
    row('page::before 宽',ps.width)+
    row('page::before left',ps.left)+
    row('page::before transform',ps.transform)+
    row('page::before 背景',ps.backgroundImage)+
    `</table><div class="note">蓝线 = .container；绿线 = 首页真实 Hero；红线 = 功能页真实 page-head。先只看线的位置，不做任何样式修复。</div>`;
  info.innerHTML=html;
}
function setRoute(next){
  route=next;buttons.forEach(b=>b.classList.toggle('is-active',b.dataset.route===next));
  try{inject();frame.contentWindow.location.hash=next;frame.contentWindow.scrollTo(0,0);setTimeout(inspect,80);setTimeout(inspect,400)}catch(e){frame.src=`./#${next}`}
}
frame.addEventListener('load',()=>{inject();setTimeout(inspect,100);setTimeout(inspect,500)});
buttons.forEach(b=>b.addEventListener('click',()=>setRoute(b.dataset.route)));
window.addEventListener('resize',()=>setTimeout(inspect,50));
</script>
</body>
</html>
